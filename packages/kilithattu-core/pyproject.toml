[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kilithattu-core"
version = "0.1.0"
description = "Kilithattu rules engine: JAX environment, replays, reference implementation"
requires-python = ">=3.11"
dependencies = ["jax>=0.4.30", "chex", "pyyaml", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/kilithattu_core"]
